[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uefn-mcp-server"
version = "0.3.0"
description = "MCP server and UEFN listener for editor automation and Verse workspace tooling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
py-modules = ["mcp_server", "uefn_listener", "init_unreal"]
packages = ["uefn_mcp"]

